<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="1040" height="680" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">AI Agent Autonomous Loop</title>
  <desc id="loop-desc">A 6-station circular agent workflow with a central shared memory hub, illustrating perceive, plan, decide, act, observe, and reflect.</desc>
  
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ring { fill: none; stroke: #4f5d75; stroke-width: 1.3; }
    .spoke { fill: none; stroke: #7a8399; stroke-width: 1; stroke-dasharray: 4 4; }
    .station { fill: #ffffff; stroke: #2d3142; stroke-width: 1.1; }
    .station.focal { fill: #fdf3ee; stroke: #eb6c36; stroke-width: 1.6; }
    .hub { fill: #2d3142; stroke: rgba(45, 49, 66, 0.12); stroke-width: 1; }
    
    .node-title { fill: #2d3142; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .focal-title { fill: #eb6c36; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .node-sub { fill: #7a8399; font-size: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; text-anchor: middle; letter-spacing: 0.02em; }
    .hub-title { fill: #f5f5f5; font-size: 15px; font-weight: 600; text-anchor: middle; letter-spacing: -0.01em; }
    .hub-sub { fill: #f5f5f5; opacity: 0.75; font-size: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; text-anchor: middle; letter-spacing: 0.04em; }
    .arrow-label { fill: #7a8399; font-size: 8.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; letter-spacing: 0.08em; text-anchor: middle; }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#7a8399" opacity="0.25"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1040" height="680" fill="#f5f5f5"/>
  <rect width="1040" height="680" fill="url(#dots)"/>

  <!-- Clockwise Ring: 6 circular arcs (R=240, Center: 520, 340) -->
  <path class="ring" d="M600 113.7 A240 240 0 0 1 705.0 187.1" marker-end="url(#arrow)"/>
  <path class="ring" d="M743.3 252.0 A240 240 0 0 1 743.7 426.9" marker-end="url(#arrow-accent)"/>
  <path class="ring" d="M705.7 492.0 A240 240 0 0 1 601.1 565.9" marker-end="url(#arrow)"/>
  <path class="ring" d="M440.0 566.3 A240 240 0 0 1 335.0 492.9" marker-end="url(#arrow)"/>
  <path class="ring" d="M296.7 428.0 A240 240 0 0 1 296.3 253.1" marker-end="url(#arrow)"/>
  <path class="ring" d="M334.3 188.0 A240 240 0 0 1 438.9 114.1" marker-end="url(#arrow)"/>

  <!-- Dashed Write-Back Spokes to Hub -->
  <path class="spoke" d="M520 132 V282" marker-end="url(#arrow-soft)"/>
  <path class="spoke" d="M668 248 L620 286" marker-end="url(#arrow-soft)"/>
  <path class="spoke" d="M668 432 L620 394" marker-end="url(#arrow-soft)"/>
  <path class="spoke" d="M520 548 V398" marker-end="url(#arrow-soft)"/>
  <path class="spoke" d="M372 432 L420 394" marker-end="url(#arrow-soft)"/>
  <path class="spoke" d="M372 248 L420 286" marker-end="url(#arrow-soft)"/>

  <!-- Spoke Badges/Labels -->
  <g transform="translate(534, 195)">
    <rect width="68" height="18" rx="4" fill="#ffffff" stroke="rgba(45, 49, 66, 0.15)" stroke-width="0.8"/>
    <text x="34" y="12.5" class="arrow-label">USER INTENT</text>
  </g>
  <g transform="translate(438, 470)">
    <rect width="70" height="18" rx="4" fill="#ffffff" stroke="rgba(45, 49, 66, 0.15)" stroke-width="0.8"/>
    <text x="35" y="12.5" class="arrow-label">TOOL TRACE</text>
  </g>

  <!-- Central Hub: Shared Memory & Context -->
  <g transform="translate(410, 288)">
    <rect class="hub" width="220" height="104" rx="8"/>
    <text x="110" y="46" class="hub-title">Shared Memory</text>
    <text x="110" y="65" class="hub-sub">WORKING CONTEXT · VECTORS</text>
    <text x="110" y="80" class="hub-sub" opacity="0.6">持久化状态与知识库沉淀</text>
  </g>

  <!-- Station 0 (12 o'clock): Perceive / 感知输入 -->
  <g transform="translate(440, 68)">
    <rect class="station" width="160" height="64" rx="6"/>
    <text x="80" y="28" class="node-title">1. Perceive · 感知</text>
    <text x="80" y="48" class="node-sub">User Prompts &amp; Workspace</text>
  </g>

  <!-- Station 1 (2 o'clock): Plan / 任务拆解 -->
  <g transform="translate(648, 188)">
    <rect class="station" width="160" height="64" rx="6"/>
    <text x="80" y="28" class="node-title">2. Plan · 规划</text>
    <text x="80" y="48" class="node-sub">Task Graph &amp; Subagents</text>
  </g>

  <!-- Station 2 (4 o'clock): Decide / 核心决策 [FOCAL GATE] -->
  <g transform="translate(648, 428)">
    <rect class="station focal" width="160" height="64" rx="6"/>
    <text x="80" y="28" class="focal-title">3. Decide · 决策</text>
    <text x="80" y="48" class="node-sub" fill="#eb6c36">LLM Core &amp; Guardrails</text>
  </g>

  <!-- Station 3 (6 o'clock): Act / 工具调用 -->
  <g transform="translate(440, 548)">
    <rect class="station" width="160" height="64" rx="6"/>
    <text x="80" y="28" class="node-title">4. Act · 执行</text>
    <text x="80" y="48" class="node-sub">Tools, APIs &amp; Sandbox</text>
  </g>

  <!-- Station 4 (8 o'clock): Observe / 状态观测 -->
  <g transform="translate(232, 428)">
    <rect class="station" width="160" height="64" rx="6"/>
    <text x="80" y="28" class="node-title">5. Observe · 观测</text>
    <text x="80" y="48" class="node-sub">Tool Results &amp; Diagnostics</text>
  </g>

  <!-- Station 5 (10 o'clock): Reflect / 自我反思 -->
  <g transform="translate(232, 188)">
    <rect class="station" width="160" height="64" rx="6"/>
    <text x="80" y="28" class="node-title">6. Reflect · 反思</text>
    <text x="80" y="48" class="node-sub">Self-Correction &amp; Update</text>
  </g>
</svg>
